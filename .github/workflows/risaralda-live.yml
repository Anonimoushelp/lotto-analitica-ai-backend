name: Risaralda Official Portal Live Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/sources/traditional_lottery_components.py"
      - "app/sources/provider_registry.py"
      - "scripts/validate_risaralda_live.py"
      - "tests/test_risaralda_live_validation.py"
      - ".github/workflows/risaralda-live.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: risaralda-live-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-official-portal:
    name: GET-only official Risaralda validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt

      - name: Run deterministic negative and contract tests
        run: pytest -q tests/test_risaralda_live_validation.py

      - name: Fetch and validate the official sales portal
        run: python scripts/validate_risaralda_live.py
