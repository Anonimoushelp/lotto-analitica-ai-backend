name: CI - Lotto Analítica AI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      ENVIRONMENT: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt
          pip install ruff==0.16.5 pip-audit==2.10.1

      - name: Verificar linting Ruff
        run: ruff check app tests

      - name: Verificar vulnerabilidades de dependencias
        run: pip-audit -r requirements.txt

      - name: Verificar sintaxis Python
        run: python -m compileall -q app tests

      - name: Verificar migraciones Alembic
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current | grep -q "(head)"

      - name: Verificar backup y restore PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: ci
          PGPASSWORD: ci
          PGDATABASE: ci
        run: bash scripts/verify_postgres_backup_restore.sh

      - name: Ejecutar pruebas
        run: pytest -q
