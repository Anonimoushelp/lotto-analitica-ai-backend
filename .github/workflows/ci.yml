name: CI - Lotto Analítica AI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      ENVIRONMENT: test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.15"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt
          pip install ruff==0.16.5 pip-audit==2.10.1

      - name: Verificar linting Ruff
        run: ruff check app tests

      - name: Verificar vulnerabilidades de dependencias
        run: pip-audit -r requirements.txt

      - name: Verificar sintaxis Python
        run: python -m compileall -q app tests

      - name: Ejecutar pruebas
        run: pytest -q
