name: Antioqueñita Live Source Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/sources/fetchers.py"
      - "app/sources/four_digit_parsers.py"
      - "app/sources/catalog.py"
      - "app/sources/registry.py"
      - "tests/test_antioquenita_live_runtime.py"
      - ".github/workflows/antioquenita-live.yml"

permissions:
  contents: read

jobs:
  live:
    name: Antioqueñita live source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
      SECRET_KEY: ci-test-secret-key-with-at-least-32-characters
      ENVIRONMENT: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13.15"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          pip install -r requirements.txt
          pip install pytest==9.0.2

      - name: Run official live integration
        run: pytest -q tests/test_antioquenita_live_runtime.py -m integration
